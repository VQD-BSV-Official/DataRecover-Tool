[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recovery-gui"
version = "0.1.0"
description = "GUI cho recovery-core (khôi phục dữ liệu)"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.scripts]
recovery-gui = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
